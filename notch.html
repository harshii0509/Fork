<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Fork notch</title>
<style>
  /* The notch growing down into a black shape (main.js puts this window over it; notch.js sizes it).
     --nw/--nh: the notch itself. Ears: small inside curves where the shape meets the menu bar. */
  :root { --nw: 185px; --nh: 32px; --ease: cubic-bezier(0.32, 0.72, 0, 1); --ear: 10px; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font: 13px/1.3 -apple-system, BlinkMacSystemFont, sans-serif; color: #fff; -webkit-font-smoothing: antialiased;
    user-select: none; cursor: default; }
  .shape { position: absolute; top: 0; left: 50%; translate: -50% 0; width: calc(var(--nw) - 12px); height: calc(var(--nh) - 2px);
    background: #000; border-radius: 0 0 12px 12px;
    transition: width 380ms var(--ease), height 380ms var(--ease), border-radius 380ms var(--ease); }
  .shape.open { border-radius: 0 0 22px 22px; }
  .shape::before, .shape::after { content: ''; position: absolute; top: 0; width: var(--ear); height: var(--ear);
    opacity: 0; transition: opacity 120ms; }
  .shape::before { right: 100%; background: radial-gradient(circle at 0 100%, transparent calc(var(--ear) - .5px), #000 var(--ear)); }
  .shape::after { left: 100%; background: radial-gradient(circle at 100% 100%, transparent calc(var(--ear) - .5px), #000 var(--ear)); }
  .shape.open::before, .shape.open::after { opacity: 1; }

  /* What's inside fades in once the shape has grown, and out before it shrinks. */
  .content { position: absolute; inset: var(--nh) 0 0; padding: 8px 14px 12px; opacity: 0; transition: opacity 120ms; }
  .shape.open .content { opacity: 1; transition: opacity 200ms 140ms; }

  .pill { display: flex; align-items: center; gap: 12px; height: 100%; border-radius: 14px; }
  .pill canvas, .row canvas { image-rendering: pixelated; }
  .text { min-width: 0; flex: 1; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .body { color: #a1a1aa; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .failed .title { color: #ff8a8f; }
  .go { color: #a1a1aa; font-size: 12px; flex: none; }

  .list { display: flex; flex-direction: column; gap: 2px; max-height: 100%; overflow-y: auto; scrollbar-width: none; }
  .list::-webkit-scrollbar { display: none; }
  .row { display: flex; align-items: center; gap: 10px; height: 44px; flex: none; box-sizing: border-box; padding: 0 8px; border-radius: 10px; }
  .row:hover { background: #ffffff17; }
  .row .title { font-weight: 500; }
  .pill, .row { cursor: pointer; }

  @media (prefers-reduced-motion: reduce) {
    .shape, .shape::before, .shape::after, .content, .shape.open .content { transition: none; }
  }
</style>
</head>
<body>
<div class="shape" id="shape"><div class="content" id="content"></div></div>
<script src="vendor/bloub/bloub.js"></script>
<script src="blob.js"></script>
<script src="notch-logic.js"></script>
<script src="notch.js"></script>
</body>
</html>
